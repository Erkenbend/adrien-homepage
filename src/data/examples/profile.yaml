# Reference example for src/data/profile.yaml: every field, with fictional values.
# The build checks that this file is valid and uses every field, so it stays up to date with
# src/data/schema.ts. It is not shown anywhere.
#
# Texts (marked "text" below) come in two forms:
#   - one string for all languages:     organization: Beispiel GmbH
#   - one string per language, all three required:
#       role: {de: Entwicklerin, en: Developer, fr: Développeuse}
#     or as a block, see `headline`.
# Dates: YYYY or YYYY-MM (e.g. 2021 or 2021-03).

# Required. Also the page title.
name: Erika Mustermann

# Required, text.
headline:
  de: Softwareentwicklerin
  en: Software developer
  fr: Développeuse logicielle

# Optional, text. Here one string for all languages.
location: Berlin

# Optional. Path below public/, i.e. this file is public/images/profile.webp.
photo: /images/profile.webp

# Optional, text. Longer texts can use YAML's folded style (">"): line breaks become spaces.
about:
  de: >
    Ich baue Webanwendungen und Werkzeuge,
    am liebsten mit TypeScript.
  en: >
    I build web applications and tools,
    preferably with TypeScript.
  fr: >
    Je développe des applications web et des outils,
    de préférence en TypeScript.

# Easter egg: while the mouse is over the photo (on touch screens: from one tap on it to the next), the photo
# and the introduction are replaced by these. Each is optional; without one, the normal version
# stays. Both need `photo`, `shadowAbout` also needs `about`.

# Optional. Path below public/, shown instead of `photo`.
shadowPhoto: /images/profile-shadow.webp

# Optional, text, shown instead of `about`.
shadowAbout:
  de: Nachts schreibe ich Code, der nur auf meinem Rechner läuft.
  en: At night I write code that only runs on my machine.
  fr: La nuit, j'écris du code qui ne tourne que sur ma machine.

# Optional list, newest first (shown in this order). If any entry of a list has a logo, all entries
# of that list leave room for one, so the texts stay aligned.
experience:
  - role: {de: Senior-Entwicklerin, en: Senior developer, fr: Développeuse senior}   # required, text
    organization: Beispiel GmbH                                                     # required
    logo: /images/logos/beispiel.svg                                                # optional, path below public/; shown on a white tile, ideally square
    location: {de: München, en: Munich, fr: Munich}                                 # optional, text
    period: {from: 2021-03}                                                         # required; no `to` = until today
    description:                                                                    # optional, text; links as in Markdown: [label](url)
      de: Verantwortlich für die [Kundenplattform](https://beispiel.de/plattform).
      en: Responsible for the [customer platform](https://beispiel.de/plattform).
      fr: Responsable de la [plateforme client](https://beispiel.de/plattform).
  - role: {de: Entwicklerin, en: Developer, fr: Développeuse}
    organization: Muster AG
    period: {from: 2017-09, to: 2021-02}

# Optional list.
certificates:
  - name: AWS Certified Solutions Architect – Associate    # required, text
    issuer: Amazon Web Services                            # required
    logo: /images/logos/aws.svg                            # optional, as in experience
    issued: 2023-05                                        # required
    validUntil: 2026-05                                    # optional, last month of validity
    url: https://example.com/credential/12345              # optional, makes the name a link
  - name: {de: Scrum-Master-Zertifikat, en: Scrum Master certificate, fr: Certificat Scrum Master}
    issuer: Scrum.org
    issued: 2019

# Optional list.
education:
  - degree: {de: Master Informatik, en: Master's in computer science, fr: Master en informatique}  # required, text
    institution: Technische Universität Musterstadt                                                # optional
    logo: /images/logos/tu-musterstadt.png                                                         # optional, as in experience
    period: {from: 2015, to: 2017}                                                                 # required; from = to is shown once, e.g. {from: 2012, to: 2012}
    description: {de: Schwerpunkt Datenbanken, en: Focus on databases, fr: Spécialisation en bases de données}  # optional, text below the title line; links as in experience
  - degree: {de: Abitur, en: Abitur (high school diploma), fr: Abitur (baccalauréat allemand)}
    period: {from: 2009, to: 2009}

# Optional list.
languages:
  - name: {de: Deutsch, en: German, fr: Allemand}            # required, text
    level: {de: Muttersprache, en: Native, fr: Langue maternelle}  # required, text
    flag: 🇩🇪                                                       # optional, one flag emoji, shown before the name
  - name: {de: Englisch, en: English, fr: Anglais}
    level: C1

# Optional list of URLs, shown below the name in this order. Known sites (see SITES in src/sites.ts)
# get their icon and name, e.g. "LinkedIn", "iSAQB" or "GitHub (<user>)" for a GitHub profile;
# other links get a generic icon and their host name, here "erika.example.com".
links:
  - https://www.linkedin.com/in/erika-mustermann
  - https://github.com/erika-mustermann
  - https://github.com/erika-work
  - https://erika.example.com

# Required. Linked in the contact section, shown like the links above.
contact: https://www.linkedin.com/in/erika-mustermann
