# Reference example for src/data/projects.yaml: every field, with fictional values.
# The build checks that this file is valid and uses every field, so it stays up to date with
# src/data/schema.ts. It is not shown anywhere.
#
# Texts (marked "text" below) come in two forms:
#   - one string for all languages:     name: Wetterstation
#   - one string per language, all three required:
#       name: {de: Vokabeltrainer, en: Vocabulary trainer, fr: Entraîneur de vocabulaire}
#     or as a block, see `description`.
# Dates: YYYY or YYYY-MM (e.g. 2021 or 2021-03).
#
# The file is a list of projects; the order does not matter, the graph places them by
# `complexity` and `aiUsage`.

- id: vocabulary-trainer    # required, unique; lowercase letters, digits and single hyphens
  visible: true             # optional, default true; false leaves the project out of the page (still validated)
  name: {de: Vokabeltrainer, en: Vocabulary trainer, fr: Entraîneur de vocabulaire}  # required, text
  icon: /images/projects/vocabulary-trainer.svg    # required; path below public/, ideally SVG or a small WebP
  # Required, x axis of the graph, from low to high:
  #   script     a single script or command-line tool
  #   demo       a demo or playground showing a technique, possibly with several small services
  #   app        a small application with one part
  #   multiPart  an application made of several parts, e.g. frontend, backend and infrastructure
  #   system     a large system, typically professional and developed over years
  complexity: multiPart
  # Required, y axis of the graph: AI used while developing, not AI in the product.
  #   none   no AI at all
  #   light  little AI assistance, e.g. completion or occasional questions
  #   heavy  large parts written with AI, reviewed and reworked by hand
  #   vibe   vibe-coded: written by AI, hardly read
  aiUsage: heavy
  description:    # required, text
    de: >
      Übt Vokabeln mit Karteikarten und wiederholt
      schwierige Wörter öfter.
    en: >
      Practises vocabulary with flash cards and repeats
      difficult words more often.
    fr: >
      Fait réviser le vocabulaire avec des fiches et répète
      plus souvent les mots difficiles.
  languages: [TypeScript]                       # optional list, shown in this order
  frameworks: [React, AWS CDK]                  # optional list, shown in this order
  # Optional: professional (for a customer or employer), training (sponsored by work, but not for a
  # customer) or hobby.
  kind: hobby
  period: {from: 2024-02, to: 2024-05}          # optional; no `to` = still ongoing, from = to is shown once
  team: group                                   # optional: solo or group
  teamDetails:                                  # optional, text, e.g. size of the team or own role
    de: Zu zweit, ich habe das Frontend gebaut.
    en: Two of us, I built the frontend.
    fr: À deux, j’ai réalisé le frontend.
  githubUrl: https://github.com/erika-mustermann/vocabulary-trainer    # optional
  websiteUrl: https://vokabeln.example.com                             # optional

# A minimal entry: only the required fields, here hidden from the page.
- id: weather-station
  visible: false
  name: Wetterstation
  icon: /images/projects/weather-station.webp
  complexity: script
  aiUsage: none
  description:
    de: Liest einen Temperatursensor aus und speichert die Werte.
    en: Reads a temperature sensor and stores the values.
    fr: Lit un capteur de température et enregistre les valeurs.
