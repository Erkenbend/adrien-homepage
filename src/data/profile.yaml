about:
  de: >
    Ich entwickle und konzipiere Software. Technischer Schwerpunkt Java Spring-Boot Backend.
    Bisher im Bereich Zahlungsverkehr (EBICS) und Finanzdienstleistung tätig.
    Franzose, seit 2016 in Deutschland. Gerade nicht auf Jobsuche.
  en: >
    I develop and design software, with a technical focus on Java Spring-Boot backends.
    So far I have worked in payments (EBICS) and financial services.
    French, living in Germany since 2016. Not looking for a job right now.
  fr: >
    Je développe et conçois des logiciels, avec un accent technique sur le backend Java Spring-Boot.
    J'ai travaillé jusqu'ici dans le paiement (EBICS) et les services financiers.
    Français, installé en Allemagne depuis 2016. Pas en recherche d'emploi actuellement.
# Easter egg, shown while the mouse is over the photo (on touch screens: tap the photo, tap again to go back).
shadowPhoto: /images/portrait_2_cut.jpg
shadowAbout:
  de: >
    Ich schreibe gerne Software, und manchmal bekomme ich dafür Geld.
    Für mich liegt der Spaß an Softwareentwicklung darin, die Freiheit zu haben,
    seine Ideen umzusetzen, auch wenn sie albern sind.
    Wer weiß, vielleicht lernt man etwas dabei?
  en: >
    I like writing software, and sometimes I get paid for it.
    For me, the fun of software development lies in the freedom
    to bring your ideas to life, even the silly ones.
    Who knows, maybe you'll learn something along the way?
  fr: >
    J'aime bien programmer, et parfois on me paie pour ça.
    Pour moi, le plaisir du développement, c'est la liberté
    de mettre ses idées en pratique, même si elles ne sont pas très sérieuses.
    Qui sait, peut-être qu'on apprendra quelque chose au passage ?

