name: CI Pipeline
run-name: ${{ github.actor }} is deploying Adrien Homepage ⬆️⬇️
on:
  push:
    branches:
      - main
jobs:
  Build_and_Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: |
          bun install

      - name: Install infrastructure dependencies
        run: |
          cd infrastructure && bun install

      - name: Lint
        run: |
          bun run lint

      - name: Build application
        run: |
          CI=false bun run build

      - name: CDK diff
        run: |
          cd infrastructure && bunx cdk diff
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'

      - name: CDK deploy
        run: |
          cd infrastructure && bunx cdk deploy --require-approval never "AdrienHomepageInfrastructureStack"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'
